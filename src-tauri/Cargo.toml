[package]
name = "deskbuddy"
version = "0.1.0"
description = "DeskBuddy - Offline-first desktop companion application"
authors = ["DeskBuddy Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
